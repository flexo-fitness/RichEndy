<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFAFD">
  <title>Richendy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root {
      --pink:#F6C8DC; --fuchsia:#BD5D98; --fuchsia-d:#a24d83; --lavender:#DED7FF; --bg:#FFFAFD; --night:#28243B; --mint:#C9F1DF;
      --mint-d:#2f8f69; --card:#ffffff; --muted:#7a7590; --border:#eadff0; --soft:#faf3fa;
      --shadow:0 1px 2px rgba(40,36,59,.04), 0 10px 28px rgba(189,93,152,.09);
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--night); font-size:15px; line-height:1.5;
      background: radial-gradient(900px 500px at 100% -10%, rgba(222,215,255,.6), transparent 60%),
                  radial-gradient(700px 500px at -10% 110%, rgba(246,200,220,.5), transparent 60%), var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

    /* ---------- Estructura: columna centrada ---------- */
    .wrap { width:100%; max-width:460px; margin:0 auto; padding:48px 20px 32px; }
    .wrap.mid { max-width:880px; }
    .wrap.wide { max-width:1160px; padding-top:32px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:44px; height:44px; border-radius:14px; background:linear-gradient(135deg,var(--fuchsia),#d98ab9); color:#fff; display:grid; place-items:center; font-weight:900; font-size:22px; flex:none; box-shadow:0 6px 16px rgba(189,93,152,.35); }
    .brand-name { font-size:20px; font-weight:800; letter-spacing:-.04em; }
    .brand-sub { color:var(--muted); font-size:12.5px; margin-top:2px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px; }
    .top-r { display:flex; align-items:center; gap:10px; }
    .me { display:flex; align-items:center; gap:9px; padding:8px 14px; border-radius:99px; background:#fff; border:1px solid var(--border); font-weight:700; font-size:14px; max-width:240px; }
    .me i { width:12px; height:12px; border-radius:50%; background:var(--fuchsia); flex:none; }
    .me span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    footer { color:var(--muted); text-align:center; font-size:12px; margin-top:26px; }

    .card { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:26px; box-shadow:var(--shadow); }
    .eyebrow { color:var(--fuchsia); text-transform:uppercase; letter-spacing:.14em; font-size:11.5px; font-weight:800; }
    h1 { font-size:clamp(26px,4vw,34px); letter-spacing:-.04em; margin:9px 0 8px; }
    h2 { font-size:17px; margin:0 0 4px; letter-spacing:-.01em; }
    .intro { color:var(--muted); font-size:14.5px; margin:0 0 22px; }
    .muted { color:var(--muted); font-size:14px; }
    .hint { color:var(--muted); font-size:12px; line-height:1.55; margin-top:20px; }
    .pagehead { margin-bottom:6px; }
    .cap { text-transform:capitalize; }
    .sub { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:14px 2px 2px; font-weight:800; }

    /* Pestañas tipo selector */
    .tabs { display:grid; grid-template-columns:repeat(var(--n,2),1fr); gap:5px; padding:5px; background:var(--soft); border:1px solid var(--border); border-radius:14px; margin-bottom:22px; }
    .tab { display:flex; justify-content:center; align-items:center; gap:7px; border:0; padding:10px 6px; border-radius:10px; background:transparent; color:var(--muted); font:inherit; font-size:14px; font-weight:700; cursor:pointer; min-height:44px; transition:background .15s, color .15s; }
    .tab:hover { color:var(--night); }
    .tab.active { background:#fff; color:var(--night); box-shadow:0 2px 10px rgba(40,36,59,.09); }
    .tab .ic { font-size:15px; }
    .badge { min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--fuchsia); color:#fff; font-size:11px; font-weight:800; display:inline-grid; place-items:center; }
    .badge[hidden] { display:none; }

    /* Formularios */
    label { display:block; font-size:13px; font-weight:700; margin:14px 0 6px; }
    input, select, textarea { width:100%; padding:12px 14px; border:1.5px solid var(--border); background:#fff; border-radius:12px; color:var(--night); font:inherit; outline:none; min-height:46px; transition:border-color .15s, box-shadow .15s; }
    textarea { min-height:84px; resize:vertical; }
    input:hover, select:hover, textarea:hover { border-color:var(--pink); }
    input:focus, select:focus, textarea:focus { border-color:var(--fuchsia); box-shadow:0 0 0 4px rgba(189,93,152,.15); }
    input[readonly] { background:var(--soft); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .primary { width:100%; border:0; border-radius:12px; padding:13px 16px; margin-top:20px; background:var(--fuchsia); color:#fff; font-weight:700; font-size:15px; cursor:pointer; min-height:46px; transition:background .15s, transform .1s; box-shadow:0 6px 16px rgba(189,93,152,.3); font-family:inherit; }
    .primary:hover { background:var(--fuchsia-d); }
    .primary:active { transform:translateY(1px); }
    .primary:disabled { opacity:.55; cursor:wait; }
    .secondary { border:1.5px solid var(--border); border-radius:12px; padding:8px 14px; background:#fff; color:var(--night); font:inherit; font-weight:600; cursor:pointer; min-height:40px; transition:background .15s, border-color .15s; }
    .secondary:hover { background:var(--lavender); border-color:var(--lavender); }
    .link { background:none; border:0; color:var(--fuchsia); font:inherit; font-size:13px; font-weight:600; text-decoration:underline; cursor:pointer; padding:6px 0; }
    :focus-visible { outline:3px solid rgba(189,93,152,.45); outline-offset:2px; }
    .message { display:none; padding:12px 14px; border-radius:12px; font-size:14px; margin-top:16px; overflow-wrap:anywhere; }
    .message.show { display:block; }
    .message.error { color:#8a2b3d; border:1px solid #f1b9c4; background:#fdecef; }
    .message.ok { color:#1f6b4d; border:1px solid #9fdcc1; background:var(--mint); }
    .notice { border:1px solid var(--lavender); background:#f4f1ff; padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:16px; }
    .setup { border:1px solid #f0cf9a; color:#7a5416; background:#fff6e5; padding:14px; border-radius:12px; font-size:14px; margin-bottom:16px; }
    .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
    .chip { font-size:12px; font-weight:700; padding:2px 10px; border-radius:99px; background:var(--soft); border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
    .chip.lime { background:var(--mint); border-color:#9fdcc1; color:var(--mint-d); }
    .chip.pet { background:var(--lavender); border-color:var(--lavender); color:var(--night); }
    .chip.late { background:#fff3dc; border-color:#f0d9a6; color:#8a6516; }

    .onb-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px; }

    /* Disposición de cada sección en escritorio */
    .split { display:grid; grid-template-columns:380px 1fr; gap:24px; align-items:start; }
    .split > #list { grid-column:2; grid-row:1 / span 6; }
    .split > .card, .split > .notice { grid-column:1; }
    .split > .card { margin-bottom:0; }

    .list { display:grid; gap:10px; }
    .item { display:flex; flex-wrap:wrap; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:12px 14px; transition:box-shadow .15s, border-color .15s; }
    .item:hover { box-shadow:var(--shadow); border-color:var(--pink); }
    .item input[type=checkbox] { width:22px; height:22px; min-height:0; accent-color:var(--fuchsia); flex:none; padding:0; }
    .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
    .meta { display:block; font-size:13px; color:var(--muted); }
    .item.done { background:var(--mint); border-color:#a9e2c9; }
    .item.done strong { text-decoration:line-through; color:#3f7a62; }
    .amount { font-weight:800; white-space:nowrap; }
    .x { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:8px 10px; min-height:38px; border-radius:10px; }
    .x:hover { background:var(--soft); color:var(--fuchsia); }
    .total { display:flex; justify-content:space-between; align-items:baseline; background:linear-gradient(135deg,var(--pink),var(--lavender)); border-radius:18px; padding:18px 22px; }
    .total strong { font-size:30px; letter-spacing:-.03em; }
    .total .muted { color:#4a4560; font-weight:600; }
    .bal { background:linear-gradient(135deg,var(--mint),var(--lavender)); border:0; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .bal p { margin:4px 0 0; font-size:16px; }
    .empty { text-align:center; color:var(--muted); padding:30px 0; }

    /* Estadísticas */
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-top:12px; }
    .stat { background:var(--soft); border:1px solid var(--border); border-radius:14px; padding:12px 14px; }
    .stat strong { display:block; font-size:22px; letter-spacing:-.02em; }
    .stat span { font-size:13px; color:var(--muted); }
    .bar { height:10px; border-radius:99px; background:var(--soft); border:1px solid var(--border); overflow:hidden; margin-top:14px; }
    .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--mint-d),#7fd6b0); }
    .prompts { margin:10px 0 0; padding-left:20px; display:grid; gap:8px; }

    /* Mascotas */
    .pethead { display:flex; align-items:center; gap:12px; }
    .pethead .grow { display:block; }
    .petav { width:48px; height:48px; border-radius:16px; background:var(--lavender); display:grid; place-items:center; font-size:26px; flex:none; }

    /* Tareas */
    .monthnav { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:18px; }
    .monthnav strong { text-transform:capitalize; font-size:22px; letter-spacing:-.02em; min-width:200px; text-align:center; }
    .monthnav button { width:44px; padding:0; font-size:20px; }
    details.card { margin-bottom:22px; padding:0; }
    details.card summary { cursor:pointer; font-weight:700; padding:16px 24px; list-style:none; display:flex; align-items:center; gap:10px; }
    details.card summary::-webkit-details-marker { display:none; }
    details.card summary::before { content:"+"; width:26px; height:26px; border-radius:8px; background:var(--fuchsia); color:#fff; display:grid; place-items:center; font-weight:800; }
    details.card[open] summary::before { content:"–"; }
    details.card form { padding:0 24px 24px; display:grid; grid-template-columns:repeat(4, 1fr); gap:0 16px; align-items:end; }
    details.card form > .primary { grid-column:1 / -1; justify-self:end; width:auto; padding:12px 28px; }
    details.card form > .fullrow { grid-column:1 / -1; }
    details.card form > div.row { display:contents; }
    .tgrid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr); gap:24px; align-items:start; }
    .tright { background:#fff; border:1px solid var(--border); border-radius:20px; padding:18px; box-shadow:var(--shadow); max-height:calc(100vh - 120px); overflow:auto; position:sticky; top:20px; }
    .tright .item { background:var(--bg); }
    .tright .item.done { background:var(--mint); }
    .sum { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .pc { background:#fff; border:1px solid var(--border); border-left:6px solid var(--pc); border-radius:16px; padding:14px 16px; display:grid; gap:2px; font-size:14px; color:var(--muted); box-shadow:var(--shadow); }
    .pc strong { color:var(--night); font-size:16px; }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:18px; background:#fff; border:1px solid var(--border); border-radius:20px; padding:16px; box-shadow:var(--shadow); }
    .cal .wd { text-align:center; font-size:12px; font-weight:700; color:var(--muted); padding-bottom:4px; }
    .dayb { min-height:78px; border:1.5px solid var(--border); background:var(--bg); border-radius:12px; color:var(--night); font:inherit; font-weight:600; font-size:14px; cursor:pointer; padding:8px 4px; display:grid; justify-items:center; align-content:space-between; transition:background .15s, border-color .15s; }
    .dayb:hover { background:var(--lavender); border-color:var(--lavender); }
    .dayb.today { border-color:var(--fuchsia); background:#fff; }
    .dayb.today > span:first-child { background:var(--fuchsia); color:#fff; border-radius:99px; min-width:26px; height:26px; display:grid; place-items:center; }
    .dayb.sel { background:var(--pink); border-color:var(--fuchsia); }
    .dayb.empty { border:0; background:none; cursor:default; pointer-events:none; }
    .dots { display:flex; gap:3px; flex-wrap:wrap; justify-content:center; min-height:10px; }
    .dot { width:10px; height:10px; border-radius:50%; border:2px solid var(--pc); display:inline-block; flex:none; background:#fff; }
    .dot.full { background:var(--pc); }
    .dayh { font-size:13px; font-weight:700; color:var(--muted); margin:14px 2px 6px; text-transform:capitalize; }
    .tright > .dayh:first-child { margin-top:0; }

    /* Perfil */
    .sw { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .swb { width:38px; height:38px; border-radius:50%; border:2px solid #fff; background:var(--c); cursor:pointer; padding:0; box-shadow:0 0 0 1px var(--border); transition:transform .1s; }
    .swb:hover { transform:scale(1.08); }
    .swb.on { box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--c); }
    .sw input[type=color] { width:46px; height:38px; min-height:38px; padding:2px; border-radius:12px; cursor:pointer; }
    .dchk { display:inline-flex; align-items:center; gap:7px; padding:8px 12px; border:1.5px solid var(--border); border-radius:12px; font-weight:700; cursor:pointer; margin:0; }
    .dchk input { width:18px; height:18px; min-height:0; padding:0; accent-color:var(--fuchsia); }

    dialog { border:0; border-radius:20px; padding:24px; width:min(92vw,380px); box-shadow:0 30px 80px rgba(40,36,59,.35); color:var(--night); }
    dialog::backdrop { background:rgba(40,36,59,.45); }
    .dlgbtn { display:flex; gap:10px; margin-top:18px; }
    .dlgbtn .primary { margin-top:0; }

    #toast { position:fixed; left:50%; bottom:28px; transform:translate(-50%,16px); opacity:0; pointer-events:none; background:var(--night); color:#fff; padding:12px 20px; border-radius:14px; font-size:14px; font-weight:600; max-width:90vw; transition:opacity .2s, transform .2s; z-index:20; box-shadow:0 10px 30px rgba(40,36,59,.3); }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

    @media (max-width:1000px) {
      .tgrid, .split, .onb-grid { grid-template-columns:1fr; }
      .split > #list, .split > .card, .split > .notice { grid-column:1; grid-row:auto; }
      .tright { position:static; max-height:none; }
      details.card form { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:760px) { .tab .lbl { display:none; } }
    @media (max-width:560px) { .row, .sum, details.card form { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dlg"><form method="dialog">
    <h2 id="dlgT"></h2>
    <label id="dlgL" for="dlgI"></label>
    <input id="dlgI" required>
    <div class="dlgbtn"><button class="secondary" value="cancel" formnovalidate>Cancelar</button><button class="primary" value="ok">Aceptar</button></div>
  </form></dialog>
  <script>
    // Valores públicos del proyecto "richendy" (clave anon). Nunca pongas aquí la service_role.
    const SUPABASE_URL = "https://qpeiqtlhxvmonysddwtn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwZWlxdGxoeHZtb255c2Rkd3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDY3NTUsImV4cCI6MjEwODc4Mjc1NX0.LkWIdJywF01HrM6x6gDoyCh1Sv27oRpBjV_Vq9JoJas";

    const $ = (s, r = document) => r.querySelector(s);
    const root = $("#root");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    const pad = n => String(n).padStart(2, "0");
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const todayISO = () => iso(new Date());
    const fdate = s => new Date(s + "T00:00").toLocaleDateString("es", { day:"numeric", month:"short" });
    const money = (n, cur) => new Intl.NumberFormat("es-CO", { style:"currency", currency: cur || "COP", maximumFractionDigits:0 }).format(n);
    const dDiff = (a, b) => Math.round((new Date(b + "T00:00") - new Date(a + "T00:00")) / 864e5);
    const addDays = (s, n) => { const d = new Date(s + "T00:00"); d.setDate(d.getDate() + n); return iso(d); };
    function nextDate(s, rec) {
      const d = new Date(s + "T00:00");
      if (rec === "weekly") { d.setDate(d.getDate() + 7); return iso(d); }
      const t = new Date(d.getFullYear() + (rec === "yearly" ? 1 : 0), d.getMonth() + (rec === "monthly" ? 1 : 0), 1);
      t.setDate(Math.min(d.getDate(), new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate()));
      return iso(t);
    }
    const rel = d => { const n = dDiff(todayISO(), d); if (n === 0) return "Hoy"; if (n === 1) return "Mañana"; if (n > 1) return `En ${n} días`; return n === -1 ? "Desde ayer" : `Desde hace ${-n} días`; };
    const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    const sha256 = async s => toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)));
    const newToken = () => toHex(crypto.getRandomValues(new Uint8Array(24)));
    const INVITE_KEY = "richendy_invite";

    let toastT;
    function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 4200); }
    async function run(fn, after) { try { await fn(); if (after) await after(); } catch (e) { toast(e?.message || "Algo salió mal. Inténtalo de nuevo."); } }
    const ok = r => { if (r.error) throw r.error; return r.data; };

    // Ventanita para pedir una fecha o un monto
    function askValue({ title, label, type, value }) {
      return new Promise(res => {
        const d = $("#dlg"), i = $("#dlgI");
        $("#dlgT").textContent = title; $("#dlgL").textContent = label;
        i.type = type; i.value = value ?? "";
        if (type === "number") { i.step = "any"; i.min = "0"; } else { i.removeAttribute("step"); i.removeAttribute("min"); }
        d.returnValue = ""; d.onclose = () => res(d.returnValue === "ok" ? i.value : null);
        d.showModal(); i.focus();
      });
    }

    // La invitación llega en #invite=TOKEN: se guarda y se quita de la URL antes de iniciar Supabase.
    const inv = location.hash.match(/invite=([a-f0-9]{48})/i);
    if (inv) { sessionStorage.setItem(INVITE_KEY, inv[1]); history.replaceState(null, "", location.pathname + location.search); }

    const isConfigured = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PEGA_AQUI") && SUPABASE_ANON_KEY.length > 20 && !SUPABASE_ANON_KEY.includes("PEGA_AQUI");
    if (!isConfigured || !window.supabase) {
      root.innerHTML = `<main class="wrap"><div class="brand" style="margin-bottom:24px"><div class="mark">R</div><div><div class="brand-name">richendy</div></div></div>
        <div class="setup">${!isConfigured ? "<strong>Falta conectar Supabase.</strong><br>Reemplaza la URL y la clave pública (anon) del proyecto en el código. Nunca uses la <code>service_role</code>." : "No se pudo cargar Supabase. Revisa tu conexión y recarga la página."}</div></main>`;
      throw new Error("Supabase no está disponible");
    }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });

    const now0 = new Date();
    const state = { me: null, home: null, tab: "inicio", mode: "login", month: { y: now0.getFullYear(), m: now0.getMonth() }, day: null,
      profiles: {}, ext: false, pets: [], avail: {}, cmap: {}, rv: null, alerts: null };
    const KINDS = { event:["Fecha importante","📅"], agreement:["Acuerdo","🤝"], payment:["Pago","💳"], vet:["Cita veterinaria","🩺"], vaccine:["Vacuna","💉"], medicine:["Medicamento","💊"], other:["Otro","📌"] };
    const REC = { weekly:"Cada semana", monthly:"Cada mes", yearly:"Cada año" };
    const SPECIES = { Perro:"🐶", Gato:"🐱", Otro:"🐾" };
    const DAYS = [[1,"L"],[2,"M"],[3,"X"],[4,"J"],[5,"V"],[6,"S"],[0,"D"]];
    const SHARED_COLOR = "#9a8fd6";
    const MES = (y, m) => new Date(y, m, 1).toLocaleDateString("es", { month: "long", year: "numeric" });
    const mRange = () => { const { y, m } = state.month; return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))]; };
    const shiftMonth = n => { const d = new Date(state.month.y, state.month.m + n, 1); state.month = { y: d.getFullYear(), m: d.getMonth() }; state.day = null; showTab(state.tab); };
    const bindMonthNav = () => { $("#mp").onclick = () => shiftMonth(-1); $("#mn").onclick = () => shiftMonth(1); };

async function loadHome() {

        const fresh = [...mc.map(c => ["c" + c.id, `${(KINDS[c.kind] || KINDS.other)[1]} ${c.title} · ${rel(c.due_date).toLowerCase()}`]), ...mt.map(a => ["t" + a.id, `✓ ${a.tasks?.title || "Tarea"} · para hoy`])].filter(([k]) => !seen.k.includes(k));
        fresh.slice(0, 5).forEach(([k, txt]) => { try { new Notification("Richendy", { body: txt }); } catch (e) { /* sin permiso */ } seen.k.push(k); });

    // Cuentas entre los dos: gastos comunes menos ajustes registrados
    async function calcBalance() {
      const me = state.me.id, other = state.home.members.map(m => m.user_id).find(id => id !== me);
      const out = { other, net: 0, cur: "COP", sets: [] };
      if (!state.ext || !other) return out;
      const hid = state.home.id;
      const [ex, st] = await Promise.all([
        sb.from("expenses").select("amount, currency, paid_by, scope, payer_share_pct").eq("household_id", hid).limit(5000),
        sb.from("settlements").select("id, paid_by, paid_to, amount, settled_on").eq("household_id", hid).order("created_at", { ascending: false }).limit(500)]);
      ok(ex).forEach(x => {
        out.cur = x.currency || out.cur; if (x.scope === "personal") return;
        const owed = Number(x.amount) * (100 - Number(x.payer_share_pct)) / 100;
        out.net += x.paid_by === me ? owed : -owed;
      });
      out.sets = ok(st);
      out.sets.forEach(s => { const a = Number(s.amount); if (s.paid_by === other && s.paid_to === me) out.net -= a; else if (s.paid_by === me && s.paid_to === other) out.net += a; });
      out.net = Math.round(out.net * 100) / 100;
      return out;
    }

        const cs = ok(await sb.from("commitments").select("*").eq("household_id", hid).eq("status", "pending").gte("due_date", t).limit(500));
        const ts = ok(await sb.from("task_assignments").select(taCols()).eq("household_id", hid).eq("status", "pending").gte("due_date", t).limit(500));
        const e = s => String(s ?? "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
        const ymd = s => s.replace(/-/g, ""), stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
        const ev = [];
        const add = (uid, date, title, desc, trig) => ev.push(["BEGIN:VEVENT", `UID:${uid}@richendy`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${ymd(date)}`, `DTEND;VALUE=DATE:${ymd(addDays(date, 1))}`, `SUMMARY:${e(title)}`, desc ? `DESCRIPTION:${e(desc)}` : "", "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${e(title)}`, `TRIGGER:${trig}`, "END:VALARM", "END:VEVENT"].filter(Boolean).join("\r\n"));
        cs.filter(mineC).forEach(c => add("c" + c.id, c.due_date, `${(KINDS[c.kind] || KINDS.other)[1]} ${c.title}`, c.notes, c.remind_days_before > 0 ? `-PT${c.remind_days_before * 24 - 9}H` : "PT9H"));
        ts.filter(mineT).forEach(r => add("t" + r.id, r.due_date, `✓ ${r.tasks?.title || "Tarea"}`, "Tarea del hogar (Richendy)", "PT8H"));
        const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Richendy//ES", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Richendy", ...ev, "END:VCALENDAR"].join("\r\n");
        const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "richendy.ics";
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast(ev.length ? `Calendario descargado (${ev.length} eventos). Ábrelo para agregarlo a tu calendario.` : "No hay nada pendiente por exportar.");

            <div class="row"><div><label for="p2k">Tipo</label><select id="p2k"><option value="vet">Cita veterinaria</option><option value="vaccine">Vacuna</option><option value="medicine">Medicamento</option></select></div>
            <div><label for="p2d">Fecha</label><input id="p2d" type="date" required value="${todayISO()}"></div></div>
            <label for="p2t">¿Qué es?</label><input id="p2t" required maxlength="120" placeholder="Control anual y vacuna triple">
            <div class="row"><div><label for="p2r">Avisar antes</label><select id="p2r"><option value="0">El mismo día</option><option value="1">1 día antes</option><option value="2">2 días antes</option><option value="3" selected>3 días antes</option><option value="7">1 semana antes</option></select></div>
            <div><label for="p2w">Se encarga</label><select id="p2w"><option value="">Los dos</option>${memberOptions("")}</select></div></div>
            <button class="primary">Guardar</button></form>
          <form class="card" id="pf3"><h2>Gasto de mascota</h2>
            ${petSelect("p3p", "Mascota").replace('<option value="">Ninguna</option>', "")}
            <label for="p3t">¿Qué se pagó?</label><input id="p3t" required maxlength="120" placeholder="Consulta veterinaria">
            <div class="row"><div><label for="p3a">Monto</label><input id="p3a" type="number" min="1" step="any" required></div>
            <div><label for="p3w">Pagó</label><select id="p3w">${memberOptions(state.me.id)}</select></div></div>
            <button class="primary">Registrar gasto (común 50/50)</button></form>
          <div class="notice">Para programar alimentación, paseos, limpieza o medicamentos diarios, ve a <strong>Tareas</strong> y elige la mascota. Las compras para ella se agregan en <strong>Compras</strong>.</div>` : ""}`,
        bindForm: () => {
          $("#pf1").addEventListener("submit", e => { e.preventDefault(); run(async () => {
            ok(await sb.from("pets").insert({ household_id: state.home.id, name: $("#pnm").value.trim(), species: $("#psp").value, created_by: state.me.id }));
            await loadPets(state.home.id); toast("Mascota agregada.");
          }, () => showTab("pets")); });
          if (!state.pets.length) return;
          $("#pf2").addEventListener("submit", e => { e.preventDefault(); run(async () => {
            ok(await sb.from("commitments").insert({ household_id: state.home.id, created_by: state.me.id, title: $("#p2t").value.trim(), kind: $("#p2k").value, due_date: $("#p2d").value,
              remind_days_before: parseInt($("#p2r").value, 10), assigned_to: $("#p2w").value || null, pet_id: $("#p2p").value }));
            $("#pf2").reset(); toast("Guardado. Te avisaremos antes de la fecha.");
          }, refresh); });
          $("#pf3").addEventListener("submit", e => { e.preventDefault(); run(async () => {
            ok(await sb.from("expenses").insert({ household_id: state.home.id, created_by: state.me.id, paid_by: $("#p3w").value, title: $("#p3t").value.trim(), category: "Otros",
              amount: parseFloat($("#p3a").value), expense_date: todayISO(), scope: "shared", payer_share_pct: 50, pet_id: $("#p3p").value }));
            $("#pf3").reset(); toast("Gasto registrado.");
          }, refresh); });
        },
        load: async () => {
          if (!state.pets.length) return '<p class="empty">Aún no hay mascotas. Agrega la primera con el formulario.</p>';
          const n = new Date(), a = iso(new Date(n.getFullYear(), n.getMonth(), 1)), b = iso(new Date(n.getFullYear(), n.getMonth() + 1, 0)), hid = state.home.id, t = todayISO();
          const [cs, ts, ex, sh] = (await Promise.all([
            sb.from("commitments").select("*").eq("household_id", hid).eq("status", "pending").not("pet_id", "is", null).order("due_date").limit(200),
            sb.from("task_assignments").select(taCols()).eq("household_id", hid).gte("due_date", a).lte("due_date", b).order("due_date").limit(500),
            sb.from("expenses").select("id, title, amount, currency, paid_by, expense_date, pet_id").eq("household_id", hid).gte("expense_date", a).not("pet_id", "is", null).order("expense_date", { ascending: false }).limit(200),
            sb.from("shopping_items").select("id, name, quantity, pet_id").eq("household_id", hid).eq("status", "pending").not("pet_id", "is", null).limit(200)])).map(ok);
          return state.pets.map(p => {
            const pc = cs.filter(c => c.pet_id === p.id).slice(0, 5), pt = ts.filter(r => r.tasks?.pet_id === p.id), pend = pt.filter(r => r.status !== "completed").slice(0, 5);
            const pe = ex.filter(x => x.pet_id === p.id), ps = sh.filter(x => x.pet_id === p.id), tot = pe.reduce((s, x) => s + Number(x.amount), 0);
            return `<div class="card"><div class="pethead"><span class="petav">${SPECIES[p.species] || "🐾"}</span><div class="grow"><h2>${esc(p.name)}</h2><span class="meta">${esc(p.species)}</span></div><button class="x" data-pdel="${p.id}">Quitar</button></div>
              <div class="sub">Próximas citas, vacunas y medicamentos</div><div class="list">${pc.length ? pc.map(cItem).join("") : '<p class="muted" style="margin:4px 2px">Nada programado.</p>'}</div>
              <div class="sub">Cuidados · este mes ${pt.filter(r => r.status === "completed").length} de ${pt.length} hechos</div><div class="list">${pend.length ? pend.map(r => taskItem(r, {}, true)).join("") : '<p class="muted" style="margin:4px 2px">Sin cuidados pendientes.</p>'}</div>
              <div class="sub">Por comprar</div>${ps.length ? `<div class="chips">${ps.map(x => `<span class="chip">${esc(x.name)} ×${Number(x.quantity)}</span>`).join("")}</div>` : '<p class="muted" style="margin:4px 2px">Nada pendiente.</p>'}
              <div class="sub">Gastos del mes · ${money(tot, pe[0]?.currency)}</div><div class="list">${pe.slice(0, 3).map(x => `<div class="item"><span class="grow"><strong>${esc(x.title)}</strong><span class="meta">pagó ${who(x.paid_by)} · ${fdate(x.expense_date)}</span></span><span class="amount">${money(x.amount, x.currency)}</span></div>`).join("") || '<p class="muted" style="margin:4px 2px">Sin gastos este mes.</p>'}</div></div>`;
          }).join("");
        },
        bind: () => {
          bindTaskActions(); bindCommitActions();
          document.querySelectorAll("[data-pdel]").forEach(b => b.onclick = () => {
            const p = petOf(b.dataset.pdel); if (!p || !confirm(`¿Quitar a ${p.name}? Sus tareas, citas y gastos se conservan, pero dejarán de estar ligados a la mascota.`)) return;
            run(async () => { ok(await sb.from("pets").delete().eq("id", p.id)); await loadPets(state.home.id); }, () => showTab("pets"));
          });
        }
      },
      /* Compras: shopping_items */
      shopping: {
        form: () => `<form class="card" id="f"><h2>Agregar producto</h2><div class="row"><div><label for="sn">Producto</label><input id="sn" required maxlength="80" placeholder="Arroz"></div>
          <div><label for="sq">Cantidad</label><input id="sq" type="number" min="0.01" step="any" value="1" required></div></div>
          ${state.ext && state.pets.length ? `<label for="spet">¿Para quién?</label><select id="spet"><option value="">Para la casa</option>${state.pets.map(p => `<option value="${p.id}">${SPECIES[p.species] || "🐾"} ${esc(p.name)}</option>`).join("")}</select>` : ""}
          <button class="primary">Agregar a la lista</button></form>`,
        bindForm: () => submit("#f", async () => { const row = { household_id: state.home.id, created_by: state.me.id, name: $("#sn").value.trim(), quantity: parseFloat($("#sq").value) };
          if (state.ext && $("#spet")?.value) row.pet_id = $("#spet").value; ok(await sb.from("shopping_items").insert(row)); }),
        load: async () => {
          const d = ok(await sb.from("shopping_items").select("id, name, quantity, status" + (state.ext ? ", pet_id" : "")).eq("household_id", state.home.id).neq("status", "cancelled").order("created_at").limit(200));
          d.sort((a, b) => (a.status === "purchased") - (b.status === "purchased"));
          return d.length ? d.map(i => `<div class="item ${i.status === "purchased" ? "done" : ""}"><input type="checkbox" data-id="${i.id}" aria-label="Marcar como comprado" ${i.status === "purchased" ? "checked" : ""}>
            <span class="grow"><strong>${esc(i.name)}</strong><span class="meta">Cantidad: ${Number(i.quantity)}</span>${i.pet_id ? `<span class="chips">${petChip(i.pet_id)}</span>` : ""}</span><button class="x" data-del="${i.id}">Quitar</button></div>`).join("")
            : '<p class="empty">La lista está vacía.</p>';
        },
        bind: () => {
          document.querySelectorAll("#list input[type=checkbox]").forEach(c => c.onchange = () => run(async () =>
            ok(await sb.from("shopping_items").update(c.checked ? { status: "purchased", purchased_by: state.me.id, purchased_at: new Date().toISOString() } : { status: "pending", purchased_by: null, purchased_at: null }).eq("id", c.dataset.id)), refresh));
          delBtn().forEach(b => b.onclick = () => run(async () => ok(await sb.from("shopping_items").delete().eq("id", b.dataset.del)), refresh));
        }
      },
      /* Compromisos: fechas importantes, acuerdos y pagos con aviso */
      commit: {
        form: () => `<form class="card" id="f"><h2>Nuevo compromiso o recordatorio</h2>
          <label for="ct">¿Qué hay que recordar?</label><input id="ct" required maxlength="120" list="csug" placeholder="Pagar el arriendo">
          <datalist id="csug"><option value="Pagar el arriendo"><option value="Pagar la luz"><option value="Pagar el internet"><option value="Cuota de la deuda compartida"><option value="Aniversario"><option value="Cumpleaños"><option value="Cita médica"></datalist>
          <div class="row"><div><label for="ck">Tipo</label><select id="ck"><option value="event">📅 Fecha importante</option><option value="payment">💳 Pago</option><option value="agreement">🤝 Acuerdo</option><option value="other">📌 Otro</option></select></div>
          <div><label for="cd">Fecha</label><input id="cd" type="date" required value="${todayISO()}"></div></div>
          <div class="row"><div><label for="cr">Avisar antes</label><select id="cr"><option value="0">El mismo día</option><option value="1">1 día antes</option><option value="2" selected>2 días antes</option><option value="3">3 días antes</option><option value="7">1 semana antes</option><option value="14">2 semanas antes</option></select></div>
          <div><label for="ca">Monto (si es un pago)</label><input id="ca" type="number" min="0" step="any"></div></div>
          <div class="row"><div><label for="cw">Responsable</label><select id="cw"><option value="">Los dos</option>${memberOptions("")}</select></div>
          <div><label for="cx">Se repite</label><select id="cx"><option value="none">No se repite</option><option value="weekly">Cada semana</option><option value="monthly">Cada mes</option><option value="yearly">Cada año</option></select></div></div>
          ${state.pets.length ? petSelect("cp", "Mascota (opcional)") : ""}
          <label for="cn">Nota (opcional)</label><input id="cn" maxlength="200" placeholder="Lo que acordamos">
          <button class="primary">Guardar compromiso</button></form>`,
        bindForm: () => submit("#f", async () => ok(await sb.from("commitments").insert({ household_id: state.home.id, created_by: state.me.id, title: $("#ct").value.trim(), kind: $("#ck").value, due_date: $("#cd").value,
          remind_days_before: parseInt($("#cr").value, 10), amount: $("#ca").value ? parseFloat($("#ca").value) : null, assigned_to: $("#cw").value || null, recurrence: $("#cx").value,
          notes: $("#cn").value.trim() || null, pet_id: $("#cp")?.value || null }))),
        load: async () => {
          const hid = state.home.id, t = todayISO();
          const [p, dn] = (await Promise.all([
            sb.from("commitments").select("*").eq("household_id", hid).eq("status", "pending").order("due_date").limit(300),
            sb.from("commitments").select("*").eq("household_id", hid).eq("status", "done").order("completed_at", { ascending: false }).limit(15)])).map(ok);
          const late = p.filter(c => c.due_date < t), next = p.filter(c => c.due_date >= t);
          const sec = (title, arr) => arr.length ? `<div class="sub">${title} (${arr.length})</div>${arr.map(cItem).join("")}` : "";
          return (sec("Quedaron pendientes", late) + sec("Próximos", next) + sec("Confirmados recientemente", dn)) || '<p class="empty">Todavía no hay compromisos. Agrega el primero.</p>';
        },
        bind: bindCommitActions
      },
      /* Revisión mensual */
      review: {
        form: () => { const { y, m } = state.month;
          return `<form class="card" id="rvf"><div class="monthnav" style="margin-bottom:6px"><button type="button" class="secondary" id="mp" aria-label="Mes anterior">‹</button><strong>${MES(y, m)}</strong><button type="button" class="secondary" id="mn" aria-label="Mes siguiente">›</button></div>
            <label for="rw">¿Qué funcionó bien?</label><textarea id="rw" maxlength="1500" placeholder="Lo que nos ayudó este mes"></textarea>
            <label for="ra">¿Qué queremos ajustar?</label><textarea id="ra" maxlength="1500" placeholder="Lo que se sintió pesado o no funcionó"></textarea>
            <label for="rg">Acuerdos para el próximo mes</label><textarea id="rg" maxlength="1500" placeholder="Lo que decidimos cambiar"></textarea>
            <button class="primary">Guardar revisión</button></form>`; },
        bindForm: () => {
          bindMonthNav();
          $("#rvf").addEventListener("submit", e => { e.preventDefault(); run(async () => {
            ok(await sb.from("monthly_reviews").upsert({ household_id: state.home.id, month: mRange()[0], went_well: $("#rw").value.trim() || null, to_adjust: $("#ra").value.trim() || null, agreements: $("#rg").value.trim() || null, updated_by: state.me.id, updated_at: new Date().toISOString() }, { onConflict: "household_id,month" }));
            toast("Revisión guardada.");
          }, refresh); });
        },
        load: async () => {
          const [a, b] = mRange(), hid = state.home.id, t = todayISO(), mem = state.home.members.map(x => x.user_id);
          const [ts, ex, cs, rv] = (await Promise.all([
            sb.from("task_assignments").select(taCols()).eq("household_id", hid).gte("due_date", a).lte("due_date", b).limit(500),
            sb.from("expenses").select("amount, currency, paid_by, scope, pet_id").eq("household_id", hid).gte("expense_date", a).lte("expense_date", b).limit(500),
            sb.from("commitments").select("*").eq("household_id", hid).gte("due_date", a).lte("due_date", b).limit(300),
            sb.from("monthly_reviews").select("went_well, to_adjust, agreements").eq("household_id", hid).eq("month", a).maybeSingle()])).map(ok);
          state.rv = rv; const bal = await calcBalance();
          const done = ts.filter(r => r.status === "completed").length, re = ts.filter(r => r.reschedule_count > 0).length, sh = ts.filter(r => r.is_shared).length;
          const pct = ts.length ? Math.round(done * 100 / ts.length) : 0, cDone = cs.filter(c => c.status === "done").length, cLate = cs.filter(c => c.status === "pending" && c.due_date < t).length;
          const ind = mem.map(id => ts.filter(r => !r.is_shared && r.assigned_to === id).length), indT = ind.reduce((s, x) => s + x, 0);
          const common = ex.filter(x => x.scope !== "personal").reduce((s, x) => s + Number(x.amount), 0), petTot = ex.filter(x => x.pet_id).reduce((s, x) => s + Number(x.amount), 0), cur = ex[0]?.currency;
          const pr = [];
          if (ts.length && ts.length - done > done && dDiff(a, t) >= 14) pr.push("Quedaron varias tareas pendientes: ¿son demasiadas, o este no era el mejor momento para hacerlas?");
          if (re >= 3 || (ts.length && re / ts.length >= 0.2)) pr.push(`Se reprogramaron ${re} tareas: ¿conviene cambiar el día, la frecuencia o quién se encarga?`);
          if (indT >= 6 && Math.max(...ind) / indT > 0.6) pr.push(`El reparto individual quedó ${ind.join(" / ")}: ¿hubo razones (viajes, trabajo, cansancio) o lo ajustamos?`);
          if (cLate) pr.push(`${cLate} ${cLate === 1 ? "compromiso venció" : "compromisos vencieron"} sin confirmarse: ¿los reprogramamos o ya no aplican?`);
          if (bal.other && Math.abs(bal.net) >= 1) pr.push("Hay un saldo pendiente entre los dos: ¿lo ajustamos esta semana?");
          pr.push("¿Qué se sintió justo este mes y qué se sintió pesado?", "¿Hay algo que quisiéramos hacer distinto el próximo mes?");
          return `<div class="card"><h2>Cómo va <span class="cap">${MES(state.month.y, state.month.m)}</span></h2>
              <div class="stats"><div class="stat"><strong>${done} de ${ts.length}</strong><span>tareas hechas</span></div><div class="stat"><strong>${re}</strong><span>reprogramadas</span></div><div class="stat"><strong>${sh}</strong><span>compartidas</span></div>
              <div class="stat"><strong>${cDone} de ${cs.length}</strong><span>compromisos confirmados</span></div><div class="stat"><strong>${money(common, cur)}</strong><span>gastos comunes</span></div><div class="stat"><strong>${money(petTot, cur)}</strong><span>en mascotas</span></div></div>
              <div class="bar" aria-label="${pct}% de las tareas hechas"><i style="width:${pct}%"></i></div>
              <p class="muted" style="margin:8px 0 0">${pct}% de las tareas del mes está hecho. Reparto individual: ${mem.map((id, i) => `${who(id)} ${ind[i]}`).join(" · ")}.</p></div>
            <div class="card"><h2>Para conversar</h2><p class="muted" style="margin:4px 0 0">Preguntas para reorganizarse juntos, sin buscar culpables.</p><ul class="prompts">${pr.map(x => `<li>${x}</li>`).join("")}</ul></div>`;
        },
        bind: () => { $("#rw").value = state.rv?.went_well || ""; $("#ra").value = state.rv?.to_adjust || ""; $("#rg").value = state.rv?.agreements || ""; }
      },
      /* Hogar: miembros e invitaciones (funciones existentes) */
      home: {
        form: () => profileCard() + `<form class="card" id="f"><h2>Invitar a tu pareja</h2><p class="muted" style="margin:0">Escribe el correo con el que ella o él creó su cuenta. El enlace es personal, vence en 7 días y solo funciona con ese correo.</p>
          <label for="ie">Correo de tu pareja</label><input id="ie" type="email" required autocomplete="off"><button class="primary">Crear enlace de invitación</button><div id="invOut"></div></form>`,
        bindForm: () => $("#f").addEventListener("submit", e => { e.preventDefault(); run(async () => {
          const token = newToken();
          ok(await sb.rpc("create_household_invitation", { target_household_id: state.home.id, target_email: $("#ie").value, target_token_hash: await sha256(token) }));
          const link = `${location.origin}${location.pathname}#invite=${token}`;
          $("#invOut").innerHTML = `<label for="il">Enlace (se muestra una sola vez)</label><input id="il" readonly value="${esc(link)}"><button type="button" class="secondary" id="cp" style="margin-top:10px">Copiar enlace</button>`;
          $("#cp").onclick = () => navigator.clipboard.writeText(link).then(() => toast("Enlace copiado."));
          $("#ie").value = "";
        }, refresh); }),
        load: async () => {
          const rows = ok(await sb.rpc("list_household_invitations", { target_household_id: state.home.id }));
          const ST = { pending: "Pendiente", accepted: "Aceptada", revoked: "Revocada", expired: "Vencida" };
          return `<div class="card"><h2>${esc(state.home.name)}</h2><div class="list" style="margin-top:12px">${state.home.members.map(m => `<div class="item"><span class="grow"><strong>${who(m.user_id)}</strong></span><span class="chip ${m.role === "owner" ? "lime" : ""}">${m.role === "owner" ? "Creó el hogar" : "Miembro"}</span></div>`).join("")}</div></div>
            <div class="card"><h2>Invitaciones</h2><div class="list" style="margin-top:12px">${rows.length ? rows.map(r => `<div class="item"><span class="grow"><strong>${esc(r.invited_email)}</strong><span class="meta">Vence ${fdate(r.expires_at.slice(0, 10))}</span></span>
              <span class="chip ${r.invitation_status === "pending" ? "lime" : ""}">${ST[r.invitation_status] || esc(r.invitation_status)}</span>
              ${r.invitation_status === "pending" ? `<button class="x" data-rev="${r.invitation_id}">Revocar</button>` : ""}</div>`).join("") : '<p class="empty">Aún no hay invitaciones.</p>'}</div></div>`;
        },
        bind: () => document.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => run(async () => ok(await sb.rpc("revoke_household_invitation", { target_invitation_id: b.dataset.rev })), refresh))
      }
    };

    // Si todavía no se ejecutó richendy_migracion.sql, las secciones nuevas explican qué falta
    const needMsg = '<div class="card"><h2>Falta activar las funciones nuevas</h2><p class="muted">Ejecuta el archivo <strong>richendy_migracion.sql</strong> en Supabase → SQL Editor y recarga esta página.</p></div>';
    ["inicio", "pets", "commit", "review"].forEach(k => {
      const p = P[k], f = p.form, l = p.load, bf = p.bindForm, bd = p.bind;
      p.form = () => state.ext ? f() : needMsg; p.load = async () => state.ext ? l() : "";
      if (bf) p.bindForm = () => { if (state.ext) bf(); }; if (bd) p.bind = () => { if (state.ext) bd(); };
    });

    sb.auth.getSession().then(({ data }) => { if (!state.me && data.session) { state.me = data.session.user; route(); } else if (!state.me) renderAuth(); });
  </script>
</body>
</html>
