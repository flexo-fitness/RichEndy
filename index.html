<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11130f">
  <title>Richendy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <style>
    :root { color-scheme: dark; --bg:#0b0c0a; --panel:#151713; --panel-2:#1d201a; --text:#f2f4ec; --muted:#a6aa9d; --lime:#c7ff4a; --border:#30342b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background: radial-gradient(circle at 80% 10%, rgba(199,255,74,.09), transparent 28rem), var(--bg); color:var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; line-height:1.5; }
    .wrap { width:100%; max-width:520px; margin:0 auto; padding:24px 18px 60px; }
    .brand { display:flex; align-items:center; gap:12px; }
    .mark { width:42px; height:42px; border-radius:14px; background:var(--lime); color:#11130f; display:grid; place-items:center; font-weight:900; font-size:22px; flex:none; }
    .brand-name { font-size:19px; font-weight:800; letter-spacing:-.04em; }
    .brand-sub { color:var(--muted); font-size:12px; margin-top:2px; }
    .card { background:rgba(21,23,19,.96); border:1px solid var(--border); border-radius:20px; padding:20px; margin-bottom:14px; }
    .eyebrow { color:var(--lime); text-transform:uppercase; letter-spacing:.13em; font-size:11px; font-weight:800; }
    h1 { font-size:clamp(26px,6vw,34px); letter-spacing:-.05em; margin:9px 0 8px; }
    h2 { font-size:16px; margin:0 0 4px; letter-spacing:-.02em; }
    .intro, .muted { color:var(--muted); font-size:14px; }
    .intro { margin:0 0 20px; }
    .seg { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:5px; background:#0d0f0c; border:1px solid var(--border); border-radius:13px; margin-bottom:18px; }
    .seg button, .apptab { border:0; padding:11px; border-radius:9px; background:transparent; color:var(--muted); font:inherit; font-weight:700; cursor:pointer; min-height:44px; }
    .seg button.active, .apptab.active { background:var(--panel-2); color:var(--text); }
    label { display:block; font-size:12px; font-weight:700; color:#dce0d4; margin:12px 0 6px; }
    input, select { width:100%; padding:12px 14px; border:1px solid var(--border); background:#0d0f0c; border-radius:12px; color:var(--text); font:inherit; outline:none; min-height:46px; }
    input:focus, select:focus { border-color:var(--lime); box-shadow:0 0 0 3px rgba(199,255,74,.1); }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    @media (max-width:420px) { .row { grid-template-columns:1fr; } }
    .primary { width:100%; border:0; border-radius:12px; padding:14px 16px; margin-top:16px; background:var(--lime); color:#11130f; font-weight:850; font-size:14px; cursor:pointer; min-height:46px; }
    .primary:disabled { opacity:.55; cursor:wait; }
    .secondary { border:1px solid var(--border); border-radius:10px; padding:9px 13px; background:transparent; color:var(--text); font:inherit; font-weight:700; cursor:pointer; min-height:40px; }
    .link { background:none; border:0; color:var(--lime); font:inherit; font-size:13px; text-decoration:underline; cursor:pointer; padding:6px 0; }
    :focus-visible { outline:2px solid var(--lime); outline-offset:2px; }
    .message { display:none; padding:12px 13px; border-radius:12px; font-size:13px; margin-top:14px; overflow-wrap:anywhere; }
    .message.show { display:block; }
    .message.error { color:#ffd0d0; border:1px solid #713c3c; background:#281716; }
    .message.ok { color:var(--lime); border:1px solid #46572a; background:#1b2411; }
    .notice { border:1px solid #46572a; background:#1b2411; color:#dfffa0; padding:12px; border-radius:12px; font-size:13px; margin-bottom:14px; }
    .setup { border:1px solid #7a6233; color:#f5dca5; background:#282112; padding:12px; border-radius:12px; font-size:13px; margin-bottom:16px; }
    .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .apptabs { display:grid; grid-template-columns:repeat(4,1fr); gap:4px; padding:5px; background:#0d0f0c; border:1px solid var(--border); border-radius:14px; margin-bottom:16px; position:sticky; top:8px; z-index:2; }
    .apptab { padding:10px 2px; font-size:13px; }
    .list { display:grid; gap:8px; margin-top:12px; }
    .item { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:11px 13px; }
    .item input[type=checkbox] { width:22px; height:22px; min-height:0; accent-color:var(--lime); flex:none; }
    .grow { flex:1; min-width:0; overflow-wrap:anywhere; }
    .meta { display:block; font-size:12px; color:var(--muted); }
    .item.done strong { text-decoration:line-through; color:var(--muted); }
    .amount { font-weight:800; white-space:nowrap; }
    .x { background:none; border:0; color:var(--muted); font:inherit; font-size:13px; cursor:pointer; padding:8px; min-height:40px; }
    .total { display:flex; justify-content:space-between; align-items:baseline; background:var(--panel-2); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-top:14px; }
    .total strong { font-size:24px; letter-spacing:-.03em; color:var(--lime); }
    .empty { text-align:center; color:var(--muted); padding:22px 0; font-size:14px; }
    .chip { font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:var(--panel-2); border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
    .chip.lime { color:var(--lime); border-color:#46572a; }

    .monthnav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .monthnav strong { text-transform:capitalize; font-size:17px; letter-spacing:-.02em; }
    .monthnav button { min-width:46px; }
    details.card summary { cursor:pointer; font-weight:800; min-height:24px; }
    .sum { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pc { background:var(--panel); border:1px solid var(--border); border-left:5px solid var(--pc); border-radius:14px; padding:10px 12px; display:grid; font-size:13px; color:var(--muted); }
    .pc strong { color:var(--text); font-size:14px; }
    .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:14px; }
    .cal .wd { text-align:center; font-size:11px; color:var(--muted); }
    .dayb { min-height:52px; border:1px solid var(--border); background:var(--panel); border-radius:10px; color:var(--text); font:inherit; font-size:13px; cursor:pointer; padding:5px 2px; display:grid; justify-items:center; align-content:space-between; }
    .dayb.today { border-color:var(--lime); } .dayb.sel { background:var(--panel-2); box-shadow:0 0 0 2px var(--lime) inset; }
    .dayb.empty { border:0; background:none; cursor:default; }
    .dots { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; min-height:8px; }
    .dot { width:9px; height:9px; border-radius:50%; border:2px solid var(--pc); display:inline-block; flex:none; }
    .dot.full { background:var(--pc); }
    .dayh { font-size:12px; color:var(--muted); margin:12px 2px 0; text-transform:capitalize; }
    .item { flex-wrap:wrap; }

    .sw { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .swb { width:38px; height:38px; border-radius:50%; border:2px solid var(--border); background:var(--c); cursor:pointer; padding:0; }
    .swb.on { box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--c); }
    .sw input[type=color] { width:46px; height:38px; min-height:38px; padding:2px; border-radius:12px; cursor:pointer; }
    #toast { position:fixed; left:50%; bottom:20px; transform:translate(-50%,16px); opacity:0; pointer-events:none; background:var(--panel-2); border:1px solid var(--border); padding:11px 16px; border-radius:12px; font-size:14px; max-width:90vw; transition:opacity .2s, transform .2s; z-index:9; }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
  </style>
</head>
<body>
  <main class="wrap" id="root"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    // Valores públicos del proyecto "richendy" (clave anon). Nunca pongas aquí la service_role.
    const SUPABASE_URL = "https://qpeiqtlhxvmonysddwtn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFwZWlxdGxoeHZtb255c2Rkd3RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDY3NTUsImV4cCI6MjEwODc4Mjc1NX0.LkWIdJywF01HrM6x6gDoyCh1Sv27oRpBjV_Vq9JoJas";

    const $ = (s, r = document) => r.querySelector(s);
    const root = $("#root");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    const pad = n => String(n).padStart(2, "0");
    const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const fdate = s => new Date(s + "T00:00").toLocaleDateString("es", { day:"numeric", month:"short" });
    const money = (n, cur) => new Intl.NumberFormat("es-CO", { style:"currency", currency: cur || "COP", maximumFractionDigits:0 }).format(n);
    const toHex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    const sha256 = async s => toHex(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)));
    const newToken = () => toHex(crypto.getRandomValues(new Uint8Array(24)));
    const INVITE_KEY = "richendy_invite";

    let toastT;
    function toast(msg, kind) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 4200); }
    async function run(fn, after) { try { await fn(); if (after) await after(); } catch (e) { toast(e?.message || "Algo salió mal. Inténtalo de nuevo."); } }
    const ok = r => { if (r.error) throw r.error; return r.data; };

    // La invitación llega en #invite=TOKEN: se guarda y se quita de la URL antes de iniciar Supabase.
    const inv = location.hash.match(/invite=([a-f0-9]{48})/i);
    if (inv) { sessionStorage.setItem(INVITE_KEY, inv[1]); history.replaceState(null, "", location.pathname + location.search); }

    if (!window.supabase) { root.innerHTML = '<div class="setup">No se pudo cargar Supabase. Revisa tu conexión y recarga la página.</div>'; throw new Error("supabase-js no cargó"); }
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true } });

    const now0 = new Date();
    const state = { me: null, home: null, tab: "tasks", mode: "login", month: { y: now0.getFullYear(), m: now0.getMonth() }, day: null, profiles: {} };
    const MES = (y, m) => new Date(y, m, 1).toLocaleDateString("es", { month: "long", year: "numeric" });
    const mRange = () => { const { y, m } = state.month; return [iso(new Date(y, m, 1)), iso(new Date(y, m + 1, 0))]; };
    const shiftMonth = n => { const d = new Date(state.month.y, state.month.m + n, 1); state.month = { y: d.getFullYear(), m: d.getMonth() }; state.day = null; showTab("tasks"); };
    // Color de cada persona: el que eligió en su perfil; si no ha elegido, los colores de la marca.
    const colorOf = id => state.profiles[id]?.color || (id === state.me.id ? "#c7ff4a" : "#e9ecdf");
    function occurrences(start, rep, last) {
      const out = [], end = new Date(last + "T00:00"), step = { once: 0, daily: 1, weekly: 7, biweekly: 14 }[rep];
      for (let d = new Date(start + "T00:00"); d <= end && out.length < 62; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + step)) { out.push(iso(d)); if (!step) break; }
      return out;
    }
    const who = id => id === state.me.id ? "Tú" : (state.profiles[id]?.name || "Tu pareja");
    const acc = id => id === state.me.id ? "mí" : (state.profiles[id]?.name || "tu pareja");
    const memberOptions = sel => state.home.members.map(m => `<option value="${m.user_id}" ${m.user_id === sel ? "selected" : ""}>${who(m.user_id)}</option>`).join("");

    /* ---------- Sesión y rutas ---------- */
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "TOKEN_REFRESHED" || event === "USER_UPDATED") return;
      if (event === "SIGNED_IN" && state.me && session?.user?.id === state.me.id) return;
      state.me = session?.user ?? null; state.home = null;
      setTimeout(route, 0); // no llamar a Supabase dentro del callback
    });

    async function loadHome() {
      const mem = ok(await sb.from("household_members").select("household_id, role, households(id, name)").eq("user_id", state.me.id).order("joined_at").limit(1));
      if (!mem.length) return null;
      const members = ok(await sb.from("household_members").select("user_id, role").eq("household_id", mem[0].household_id));
      await loadProfiles(mem[0].household_id);
      return { id: mem[0].household_id, name: mem[0].households?.name || "Mi hogar", role: mem[0].role, members };
    }

    async function route() {
      if (!state.me) return renderAuth();
      root.innerHTML = '<p class="muted" style="text-align:center;padding:60px 0">Cargando…</p>';
      try {
        state.home = await loadHome();
        const t = sessionStorage.getItem(INVITE_KEY);
        if (t) {
          sessionStorage.removeItem(INVITE_KEY);
          if (!state.home) {
            try { ok(await sb.rpc("accept_household_invitation", { invitation_token_hash: await sha256(t) })); state.home = await loadHome(); toast("Te uniste al hogar."); }
            catch (e) { toast(e.message); }
          }
        }
        state.home ? renderApp() : renderOnboarding();
      } catch (e) {
        root.innerHTML = `<div class="card"><div class="message error show">${esc(e.message)}</div><button class="secondary" id="out" style="margin-top:12px">Cerrar sesión</button></div>`;
        $("#out").onclick = () => sb.auth.signOut();
      }
    }

    /* ---------- Acceso ---------- */
    function renderAuth() {
      const up = state.mode === "signup";
      root.innerHTML = `
      <div class="brand" style="margin-bottom:24px"><div class="mark">R</div><div><div class="brand-name">richendy</div><div class="brand-sub">Un hogar compartido, más organizado.</div></div></div>
      <section class="card" style="padding:28px">
        <div class="eyebrow">Tu espacio compartido</div>
        <h1>${up ? "Empieza por aquí." : "Qué bueno verte."}</h1>
        <p class="intro">${up ? "Crea tu cuenta personal para empezar a usar Richendy." : "Inicia sesión para entrar a Richendy y continuar organizando el hogar."}</p>
        ${sessionStorage.getItem(INVITE_KEY) ? '<div class="notice">Te invitaron a un hogar. Entra con el correo al que llegó la invitación.</div>' : ""}
        <div class="seg"><button type="button" id="tLogin" class="${up ? "" : "active"}">Iniciar sesión</button><button type="button" id="tSignup" class="${up ? "active" : ""}">Crear cuenta</button></div>
        <form id="authForm">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" autocomplete="email" placeholder="tu@correo.com" required>
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="${up ? "new-password" : "current-password"}" minlength="8" placeholder="Mínimo 8 caracteres" required>
          <button class="primary" id="go" type="submit">${up ? "Crear cuenta" : "Entrar a Richendy"}</button>
        </form>
        <div id="msg" class="message" role="status" aria-live="polite"></div>
      </section>
      <p class="muted" style="text-align:center;font-size:11px">Richendy · Privado para ustedes</p>`;
      $("#tLogin").onclick = () => { state.mode = "login"; renderAuth(); };
      $("#tSignup").onclick = () => { state.mode = "signup"; renderAuth(); };
      $("#authForm").addEventListener("submit", async e => {
        e.preventDefault();
        const msg = $("#msg"), go = $("#go"), email = $("#email").value.trim(), password = $("#password").value;
        const show = (t, k) => { msg.textContent = t; msg.className = "message show " + k; };
        msg.className = "message"; go.disabled = true;
        try {
          if (up) {
            const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
            if (error) throw error;
            if (!data.session) show("Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.", "ok");
          } else {
            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
        } catch (err) { show(err?.message || "Ocurrió un error de autenticación.", "error"); }
        finally { go.disabled = false; }
      });
    }

    /* ---------- Crear hogar o unirse ---------- */
    const logoutBtn = '<button class="secondary" id="out">Salir</button>';
    function renderOnboarding() {
      root.innerHTML = `<div class="top"><div class="brand"><div class="mark">R</div><div class="brand-name">richendy</div></div>${logoutBtn}</div>
      <h1>Empecemos con su hogar</h1><p class="intro">Crea el hogar o únete con la invitación de tu pareja.</p>
      <form class="card" id="createF"><h2>Crear un hogar nuevo</h2>
        <label for="hn">Nombre del hogar</label><input id="hn" value="Nuestro hogar" minlength="2" maxlength="80" required>
        <button class="primary">Crear hogar</button></form>
      <form class="card" id="joinF"><h2>Unirme con una invitación</h2>
        <p class="muted" style="margin:0">Pega el enlace que te compartieron. Debes tener sesión con el correo invitado.</p>
        <label for="jc">Enlace de invitación</label><input id="jc" required autocomplete="off">
        <button class="primary">Unirme al hogar</button></form>`;
      $("#out").onclick = () => sb.auth.signOut();
      $("#createF").addEventListener("submit", e => { e.preventDefault();
        run(async () => ok(await sb.rpc("create_my_household", { household_name: $("#hn").value })), route); });
      $("#joinF").addEventListener("submit", e => { e.preventDefault();
        const m = $("#jc").value.match(/[a-f0-9]{48}/i);
        run(async () => { if (!m) throw new Error("El enlace no es válido."); ok(await sb.rpc("accept_household_invitation", { invitation_token_hash: await sha256(m[0]) })); }, route); });
    }

    /* ---------- Pantalla principal ---------- */
    const TABS = [["tasks","Tareas"], ["expenses","Gastos"], ["shopping","Compras"], ["home","Hogar"]];
    function renderApp() {
      root.innerHTML = `<div class="top"><div class="brand"><div class="mark">R</div><div><div class="brand-name">richendy</div><div class="brand-sub">${esc(state.home.name)}</div></div></div>${logoutBtn}</div>
      <nav class="apptabs" aria-label="Secciones">${TABS.map(([k, t]) => `<button class="apptab" data-t="${k}">${t}</button>`).join("")}</nav><section id="panel"></section>`;
      $("#out").onclick = () => sb.auth.signOut();
      document.querySelectorAll(".apptab").forEach(b => b.onclick = () => showTab(b.dataset.t));
      showTab(state.tab);
    }
    async function showTab(t) {
      state.tab = t;
      document.querySelectorAll(".apptab").forEach(b => b.classList.toggle("active", b.dataset.t === t));
      $("#panel").innerHTML = P[t].form() + '<div id="list" class="list"><p class="empty">Cargando…</p></div>';
      P[t].bindForm?.(); if (t === "home") bindProfile();
      await refresh();
    }
    async function refresh() {
      const t = state.tab, p = P[t]; if (!p || !$("#list")) return;
      try { await loadProfiles(state.home.id); const html = await p.load(); if (state.tab !== t || !$("#list")) return; $("#list").innerHTML = html; p.bind?.(); }
      catch (e) { if (state.tab === t && $("#list")) $("#list").innerHTML = `<div class="message error show">${esc(e.message)}</div>`; }
    }
    // Sincronización entre las dos cuentas: se actualiza la lista al volver a la pestaña y cada 25 s.
    document.addEventListener("visibilitychange", () => { if (!document.hidden && state.home) refresh(); });
    setInterval(() => { if (!document.hidden && state.home) refresh(); }, 25000);
    const submit = (id, fn) => $(id).addEventListener("submit", e => { e.preventDefault(); const f = e.target; run(async () => { await fn(f); f.reset(); }, refresh); });
    const delBtn = () => document.querySelectorAll("[data-del]");

    /* ---------- Perfil: nombre y color de cada persona (profiles.display_name / accent_color) ---------- */
    const SW = ["#c7ff4a", "#ff8fb1", "#7dd3fc", "#ffb454", "#c4a7ff", "#5eead4", "#ffe066", "#ff7a6b"];
    const lum = h => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    async function loadProfiles(hid) {
      try { const rows = ok(await sb.rpc("list_household_profiles", { target_household_id: hid }));
        state.profiles = Object.fromEntries(rows.map(r => [r.user_id, { name: (r.display_name || "").trim(), color: r.accent_color }])); }
      catch (e) { /* se conservan los últimos valores */ }
    }
    function profileCard() {
      const mine = state.profiles[state.me.id] || {}, col = mine.color || "#c7ff4a";
      return `<form class="card" id="pff"><h2>Mi perfil</h2><p class="muted" style="margin:0">Tu nombre y tu color se ven en el calendario y en las tareas, y tu pareja los ve igual.</p>
        <label for="pn">Nombre</label><input id="pn" maxlength="30" value="${esc(mine.name || "")}" placeholder="Cómo te ve tu pareja">
        <label>Color</label><div class="sw" id="sw">${SW.map(c => `<button type="button" class="swb ${c === col.toLowerCase() ? "on" : ""}" data-c="${c}" style="--c:${c}" aria-label="Color ${c}"></button>`).join("")}<input type="color" id="pc" value="${col}" aria-label="Elegir otro color"></div>
        <button class="primary">Guardar perfil</button></form>`;
    }
    function bindProfile() {
      const mark = c => document.querySelectorAll(".swb").forEach(b => b.classList.toggle("on", b.dataset.c === c.toLowerCase()));
      document.querySelectorAll(".swb").forEach(b => b.onclick = () => { $("#pc").value = b.dataset.c; mark(b.dataset.c); });
      $("#pc").oninput = e => mark(e.target.value);
      $("#pff").addEventListener("submit", e => { e.preventDefault(); run(async () => {
        const color = $("#pc").value, name = $("#pn").value.trim();
        if (lum(color) < 0.12) throw new Error("Elige un tono más claro para que se vea sobre el fondo oscuro.");
        const r = ok(await sb.from("profiles").update({ display_name: name || null, accent_color: color }).eq("id", state.me.id).select("id"));
        if (!r.length) throw new Error("No se encontró tu perfil.");
        await loadProfiles(state.home.id); toast("Perfil guardado.");
      }, refresh); });
    }

    const P = {
      /* Tareas del mes: tasks (la tarea) + task_assignments (cada vez que toca) + activity_logs (quién la hizo) */
      tasks: {
        form: () => {
          const { y, m } = state.month, [a, b] = mRange(), now = new Date();
          const start = (now.getFullYear() === y && now.getMonth() === m) ? iso(now) : a;
          return `<div class="monthnav"><button class="secondary" id="mp" aria-label="Mes anterior">‹</button><strong>${MES(y, m)}</strong><button class="secondary" id="mn" aria-label="Mes siguiente">›</button></div>
          <details class="card" id="plan"><summary>Programar tareas del mes</summary>
            <form id="pf"><label for="pt">Tarea</label><input id="pt" required maxlength="120" placeholder="Lavar los platos">
              <div class="row"><div><label for="pr">Se repite</label><select id="pr"><option value="once">Una sola vez</option><option value="daily">Cada día</option><option value="weekly">Cada semana</option><option value="biweekly">Cada 2 semanas</option></select></div>
              <div><label for="ps">Desde el día</label><input id="ps" type="date" required min="${a}" max="${b}" value="${start}"></div></div>
              <label for="pw">Quién la hace</label><select id="pw"><option value="split">Dividir entre los dos (equilibrado)</option>${memberOptions("")}</select>
              <button class="primary">Programar en el calendario</button></form></details>`;
        },
        bindForm: () => {
          $("#mp").onclick = () => { shiftMonth(-1); };
          $("#mn").onclick = () => { shiftMonth(1); };
          $("#pf").addEventListener("submit", e => { e.preventDefault(); run(async () => {
            const [a, b] = mRange(), rep = $("#pr").value, who_ = $("#pw").value;
            const dates = occurrences($("#ps").value, rep, b);
            if (!dates.length) throw new Error("No hay fechas dentro de este mes.");
            const ids = state.home.members.map(x => x.user_id).sort((p, q) => (q === state.me.id) - (p === state.me.id));
            const ex = ok(await sb.from("task_assignments").select("assigned_to").eq("household_id", state.home.id).gte("due_date", a).lte("due_date", b));
            const count = Object.fromEntries(ids.map(id => [id, ex.filter(r => r.assigned_to === id).length]));
            const rows = dates.map(d => { const to = who_ === "split" ? ids.reduce((best, id) => count[id] < count[best] ? id : best, ids[0]) : who_; count[to]++; return { household_id: state.home.id, assigned_to: to, assigned_by: state.me.id, due_date: d }; });
            const t = ok(await sb.from("tasks").insert({ household_id: state.home.id, title: $("#pt").value.trim(), frequency: { once: "occasional", daily: "daily", weekly: "weekly", biweekly: "weekly" }[rep], created_by: state.me.id }).select("id").single());
            const r = await sb.from("task_assignments").insert(rows.map(x => ({ ...x, task_id: t.id })));
            if (r.error) { await sb.from("tasks").delete().eq("id", t.id); throw r.error; }
            $("#pf").reset(); $("#plan").open = false; toast(`Programadas ${rows.length} ${rows.length === 1 ? "vez" : "veces"} en el mes.`);
          }, refresh); });
        },
        load: async () => {
          const [a, b] = mRange(), { y, m } = state.month, mem = state.home.members.map(x => x.user_id);
          const rows = ok(await sb.from("task_assignments").select("id, status, due_date, assigned_to, tasks(title)").eq("household_id", state.home.id).gte("due_date", a).lte("due_date", b).order("due_date").limit(500));
          const logs = ok(await sb.from("activity_logs").select("task_assignment_id, user_id").eq("household_id", state.home.id).eq("action", "task_completed").gte("created_at", new Date(y, m - 1, 1).toISOString()).order("created_at").limit(1000));
          const by = {}; logs.forEach(l => by[l.task_assignment_id] = l.user_id); // la última marca gana
          const doneBy = r => by[r.id] || r.assigned_to, isDone = r => r.status === "completed";
          const sum = mem.map(id => `<div class="pc" style="--pc:${colorOf(id)}"><strong>${who(id)}</strong>
            <span>Asignadas: ${rows.filter(r => r.assigned_to === id).length}</span><span>Hechas por ${id === state.me.id ? "ti" : acc(id)}: ${rows.filter(r => isDone(r) && doneBy(r) === id).length}</span>
            <span>Pendientes: ${rows.filter(r => r.assigned_to === id && !isDone(r)).length}</span></div>`).join("");
          const first = new Date(y, m, 1), lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate(), today = iso(new Date());
          let cal = ["L","M","X","J","V","S","D"].map(d => `<div class="wd">${d}</div>`).join("") + '<div class="dayb empty"></div>'.repeat(lead);
          for (let d = 1; d <= days; d++) {
            const ds = iso(new Date(y, m, d)), rs = rows.filter(r => r.due_date === ds);
            cal += `<button type="button" class="dayb ${ds === today ? "today" : ""} ${ds === state.day ? "sel" : ""}" data-day="${ds}" aria-label="${d} de ${MES(y, m)}: ${rs.length} tareas"><span>${d}</span>
              <span class="dots">${rs.slice(0, 4).map(r => `<i class="dot ${isDone(r) ? "full" : ""}" style="--pc:${colorOf(r.assigned_to)}"></i>`).join("")}</span></button>`;
          }
          const item = r => { const done = isDone(r), other = mem.find(id => id !== r.assigned_to);
            return `<div class="item ${done ? "done" : ""}"><i class="dot full" style="--pc:${colorOf(done ? doneBy(r) : r.assigned_to)}"></i><input type="checkbox" data-id="${r.id}" aria-label="Marcar como hecha" ${done ? "checked" : ""}>
              <span class="grow"><strong>${esc(r.tasks?.title)}</strong><span class="meta">${done ? "Hecha por: " + who(doneBy(r)) : "Asignada a: " + who(r.assigned_to)}</span></span>
              ${!done && other ? `<button class="x" data-move="${r.id}" data-to="${other}">Pasar a ${acc(other)}</button>` : ""}<button class="x" data-del="${r.id}">Quitar</button></div>`; };
          const shown = state.day ? rows.filter(r => r.due_date === state.day) : rows;
          let list = "", last = "";
          shown.forEach(r => { if (r.due_date !== last) { last = r.due_date; list += `<div class="dayh">${new Date(last + "T00:00").toLocaleDateString("es", { weekday: "long", day: "numeric", month: "short" })}</div>`; } list += item(r); });
          return `<div class="sum">${sum}</div><p class="muted" style="font-size:12px;margin:8px 2px 0">Estos números sirven para conversar y ajustar el reparto, no para compararse.</p>
            <div class="cal">${cal}</div>
            <div class="dayh" style="display:flex;justify-content:space-between;align-items:center"><span>${state.day ? "Día seleccionado" : "Todo el mes"}</span>${state.day ? '<button class="link" id="allm">Ver todo el mes</button>' : ""}</div>
            ${list || '<p class="empty">No hay tareas programadas. Usa «Programar tareas del mes».</p>'}`;
        },
        bind: () => {
          document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { state.day = state.day === b.dataset.day ? null : b.dataset.day; refresh(); });
          $("#allm")?.addEventListener("click", () => { state.day = null; refresh(); });
          document.querySelectorAll("#list input[type=checkbox]").forEach(c => c.onchange = () => run(async () => {
            ok(await sb.from("task_assignments").update(c.checked ? { status: "completed", completed_at: new Date().toISOString() } : { status: "pending", completed_at: null }).eq("id", c.dataset.id));
            if (c.checked) ok(await sb.from("activity_logs").insert({ household_id: state.home.id, user_id: state.me.id, task_assignment_id: c.dataset.id, action: "task_completed" }));
          }, refresh));
          document.querySelectorAll("[data-move]").forEach(b => b.onclick = () => run(async () => ok(await sb.from("task_assignments").update({ assigned_to: b.dataset.to }).eq("id", b.dataset.move)), refresh));
          delBtn().forEach(b => b.onclick = () => run(async () => ok(await sb.from("task_assignments").delete().eq("id", b.dataset.del)), refresh));
        }
      },
      /* Gastos: expenses (mes actual) */
      expenses: {
        form: () => `<form class="card" id="f"><label for="et" style="margin-top:0">¿Qué se pagó?</label><input id="et" required maxlength="120" placeholder="Mercado de la semana">
          <div class="row"><div><label for="ea">Monto</label><input id="ea" type="number" min="1" step="any" inputmode="decimal" required></div>
          <div><label for="ec">Categoría</label><select id="ec">${["Mercado","Servicios","Hogar","Salidas","Otros"].map(c => `<option>${c}</option>`).join("")}</select></div></div>
          <div class="row"><div><label for="ep">Pagó</label><select id="ep">${memberOptions(state.me.id)}</select></div>
          <div><label for="ed">Fecha</label><input id="ed" type="date" required value="${iso(new Date())}"></div></div>
          <button class="primary">Registrar gasto</button></form>`,
        bindForm: () => submit("#f", async () => ok(await sb.from("expenses").insert({ household_id: state.home.id, created_by: state.me.id, paid_by: $("#ep").value,
          title: $("#et").value.trim(), category: $("#ec").value, amount: parseFloat($("#ea").value), expense_date: $("#ed").value }))),
        load: async () => {
          const n = new Date(), from = iso(new Date(n.getFullYear(), n.getMonth(), 1));
          const d = ok(await sb.from("expenses").select("id, title, category, amount, currency, paid_by, expense_date").eq("household_id", state.home.id).gte("expense_date", from).order("expense_date", { ascending: false }).limit(200));
          const sum = a => a.reduce((s, x) => s + Number(x.amount), 0), cur = d[0]?.currency;
          const per = state.home.members.map(m => `${who(m.user_id)}: ${money(sum(d.filter(x => x.paid_by === m.user_id)), cur)}`).join(" · ");
          return `<div class="total"><span class="muted">Este mes</span><strong>${money(sum(d), cur)}</strong></div><p class="muted" style="margin:8px 2px 0">${per}</p>` +
            (d.length ? d.map(x => `<div class="item"><span class="grow"><strong>${esc(x.title)}</strong><span class="meta">${esc(x.category)} · pagó ${who(x.paid_by)} · ${fdate(x.expense_date)}</span></span>
              <span class="amount">${money(x.amount, x.currency)}</span><button class="x" data-del="${x.id}">Quitar</button></div>`).join("") : '<p class="empty">No hay gastos este mes.</p>');
        },
        bind: () => delBtn().forEach(b => b.onclick = () => run(async () => ok(await sb.from("expenses").delete().eq("id", b.dataset.del)), refresh))
      },
      /* Compras: shopping_items */
      shopping: {
        form: () => `<form class="card" id="f"><div class="row"><div><label for="sn" style="margin-top:0">Producto</label><input id="sn" required maxlength="80" placeholder="Arroz"></div>
          <div><label for="sq" style="margin-top:0">Cantidad</label><input id="sq" type="number" min="0.01" step="any" value="1" required></div></div>
          <button class="primary">Agregar a la lista</button></form>`,
        bindForm: () => submit("#f", async () => ok(await sb.from("shopping_items").insert({ household_id: state.home.id, created_by: state.me.id, name: $("#sn").value.trim(), quantity: parseFloat($("#sq").value) }))),
        load: async () => {
          const d = ok(await sb.from("shopping_items").select("id, name, quantity, status").eq("household_id", state.home.id).neq("status", "cancelled").order("created_at").limit(200));
          d.sort((a, b) => (a.status === "purchased") - (b.status === "purchased"));
          return d.length ? d.map(i => `<div class="item ${i.status === "purchased" ? "done" : ""}"><input type="checkbox" data-id="${i.id}" aria-label="Marcar como comprado" ${i.status === "purchased" ? "checked" : ""}>
            <span class="grow"><strong>${esc(i.name)}</strong><span class="meta">Cantidad: ${Number(i.quantity)}</span></span><button class="x" data-del="${i.id}">Quitar</button></div>`).join("")
            : '<p class="empty">La lista está vacía.</p>';
        },
        bind: () => {
          document.querySelectorAll("#list input[type=checkbox]").forEach(c => c.onchange = () => run(async () =>
            ok(await sb.from("shopping_items").update(c.checked ? { status: "purchased", purchased_by: state.me.id, purchased_at: new Date().toISOString() } : { status: "pending", purchased_by: null, purchased_at: null }).eq("id", c.dataset.id)), refresh));
          delBtn().forEach(b => b.onclick = () => run(async () => ok(await sb.from("shopping_items").delete().eq("id", b.dataset.del)), refresh));
        }
      },
      /* Hogar: miembros e invitaciones (funciones existentes) */
      home: {
        form: () => profileCard() + `<form class="card" id="f"><h2>Invitar a tu pareja</h2><p class="muted" style="margin:0">Escribe el correo con el que ella o él creó su cuenta. El enlace es personal, vence en 7 días y solo funciona con ese correo.</p>
          <label for="ie">Correo de tu pareja</label><input id="ie" type="email" required autocomplete="off"><button class="primary">Crear enlace de invitación</button><div id="invOut"></div></form>`,
        bindForm: () => $("#f").addEventListener("submit", e => { e.preventDefault(); run(async () => {
          const token = newToken();
          ok(await sb.rpc("create_household_invitation", { target_household_id: state.home.id, target_email: $("#ie").value, target_token_hash: await sha256(token) }));
          const link = `${location.origin}${location.pathname}#invite=${token}`;
          $("#invOut").innerHTML = `<label for="il">Enlace (se muestra una sola vez)</label><input id="il" readonly value="${esc(link)}"><button type="button" class="secondary" id="cp" style="margin-top:10px">Copiar enlace</button>`;
          $("#cp").onclick = () => navigator.clipboard.writeText(link).then(() => toast("Enlace copiado."));
          $("#ie").value = "";
        }, refresh); }),
        load: async () => {
          const rows = ok(await sb.rpc("list_household_invitations", { target_household_id: state.home.id }));
          const ST = { pending: "Pendiente", accepted: "Aceptada", revoked: "Revocada", expired: "Vencida" };
          return `<div class="card"><h2>${esc(state.home.name)}</h2><div class="list">${state.home.members.map(m => `<div class="item"><span class="grow"><strong>${who(m.user_id)}</strong></span><span class="chip ${m.role === "owner" ? "lime" : ""}">${m.role === "owner" ? "Creó el hogar" : "Miembro"}</span></div>`).join("")}</div></div>
            <div class="card"><h2>Invitaciones</h2><div class="list">${rows.length ? rows.map(r => `<div class="item"><span class="grow"><strong>${esc(r.invited_email)}</strong><span class="meta">Vence ${fdate(r.expires_at.slice(0, 10))}</span></span>
              <span class="chip ${r.invitation_status === "pending" ? "lime" : ""}">${ST[r.invitation_status] || esc(r.invitation_status)}</span>
              ${r.invitation_status === "pending" ? `<button class="x" data-rev="${r.invitation_id}">Revocar</button>` : ""}</div>`).join("") : '<p class="empty">Aún no hay invitaciones.</p>'}</div></div>`;
        },
        bind: () => document.querySelectorAll("[data-rev]").forEach(b => b.onclick = () => run(async () => ok(await sb.rpc("revoke_household_invitation", { target_invitation_id: b.dataset.rev })), refresh))
      }
    };

    sb.auth.getSession().then(({ data }) => { if (!state.me && data.session) { state.me = data.session.user; route(); } else if (!state.me) renderAuth(); });
  </script>
</body>
</html>
